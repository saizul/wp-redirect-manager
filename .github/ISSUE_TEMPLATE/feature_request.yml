name: Feature request
description: Suggest an improvement to matching, the 404 monitor, import/export, WP-CLI or developer hooks.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Redirect Manager stays small on purpose: fast lookups, no external services, no tracking.
        Features that fit are about correct redirects, migration, the admin workflow and developer hooks.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could a regex rule, a filter or a CSV import do this instead?
  - type: checkboxes
    id: build
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
